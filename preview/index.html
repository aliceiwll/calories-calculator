.cal__forward { display: flex; transform: rotate(180deg); }

.cal__grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: var(--space-1);
}

.cal__weekday {
  padding-bottom: var(--space-2);
  font-family: var(--family-record);
  font-size: var(--size-100);
  color: var(--text-muted);
  text-align: center;
}

/* No dots, no totals, no marks for days with entries — see the note in
   CalendarSheet. A day you wrote nothing on looks like a day you did. */
.cal__day {
  aspect-ratio: 1;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  font-family: var(--family-figure);
  font-size: var(--size-200);
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  cursor: pointer;
}

.cal__day:disabled { color: var(--border-strong); cursor: default; }
.cal__day[aria-current='date'] { color: var(--text-action); font-weight: var(--weight-medium); }
.cal__day[aria-pressed='true'] { background: var(--surface-tint); }
.cal__day:focus-visible { outline: var(--focus-ring); }


/* ---------- Profile ---------- */

.profile__note {
  margin: var(--space-6) 0 0;
  font-family: var(--voice-family);
  font-style: var(--voice-style);
  font-size: var(--voice-size);
  line-height: var(--voice-leading);
  color: var(--text-secondary);
}


/* ---------- Camera ---------- */
/* A prototype camera: no permissions, no device API, and a still where
   the preview would be. It exists because "analyse a photo" used to
   land on a result without anything having been photographed. */

.camera {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface-invert);
  overflow: clip;
}

.camera__view {
  position: relative;
  flex: 1;
  min-height: 0;
  background: var(--surface-invert) center / cover no-repeat;
}

/* Framing guides, not a viewfinder chrome set. */
.camera__frame {
  position: absolute;
  inset: var(--space-6);
  border: 1px solid var(--paper-100);
  border-radius: var(--radius-md);
  opacity: 0.4;
}

.camera__close {
  position: absolute;
  top: var(--space-4);
  left: var(--space-4);
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--target-min);
  height: var(--target-min);
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--surface-page);
  color: var(--text-primary);
  cursor: pointer;
}

.camera__close:focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-offset); }

.camera__hint {
  position: absolute;
  left: var(--space-6);
  right: var(--space-6);
  bottom: var(--space-6);
  margin: 0;
  font-family: var(--voice-family);
  font-style: var(--voice-style);
  font-size: var(--voice-size);
  line-height: var(--voice-leading);
  color: var(--text-invert);
  text-align: center;
}

.camera__working {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-4);
}

.camera__working::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--surface-invert);
  opacity: 0.6;
}

.camera__working > * { position: relative; }

/* The one literal duration in the system, alongside the 1px hairline
   and the 44px target: a spinner's period is a mechanism, not a brand
   decision, and there is no motion token that means "keeps going". */
.camera__spinner {
  width: var(--space-6);
  height: var(--space-6);
  border: 2px solid var(--paper-400);
  border-top-color: var(--paper-100);
  border-radius: var(--radius-pill);
  animation: camera-spin 900ms linear infinite;
}

@keyframes camera-spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .camera__spinner { animation: none; }
}

.camera__working-text {
  font-family: var(--voice-family);
  font-style: var(--voice-style);
  font-size: var(--voice-size);
  color: var(--text-invert);
}

.camera__bar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-5) var(--page-gutter);
  background: var(--surface-invert);
}

.camera__gallery, .camera__spacer {
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--target-min);
  height: var(--target-min);
  border: 0;
  background: transparent;
  color: var(--text-invert);
  cursor: pointer;
}

.camera__gallery:disabled { opacity: 0.4; cursor: default; }
.camera__gallery:focus-visible { outline: 2px solid var(--paper-100); border-radius: var(--radius-sm); }

.camera__shutter {
  display: flex;
  align-items: center;
  justify-content: center;
  width: calc(var(--space-7) + var(--space-5));
  height: calc(var(--space-7) + var(--space-5));
  padding: 0;
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--paper-100);
  cursor: pointer;
}

.camera__shutter:disabled { opacity: 0.5; cursor: default; }
.camera__shutter:active { background: var(--paper-300); }
.camera__shutter:focus-visible { outline: 2px solid var(--paper-100); outline-offset: 4px; }

.camera__shutter-ring {
  width: calc(var(--space-7) + var(--space-2));
  height: calc(var(--space-7) + var(--space-2));
  border: 2px solid var(--ink-900);
  border-radius: var(--radius-pill);
}


/* ---------- Meal picker ---------- */
/* Sits under the portion control in the same sheet, so choosing how
   much and choosing which meal happen in one place. */

.mealpick {
  margin-top: var(--space-5);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border-hairline);
}

.mealpick__label {
  display: block;
  margin-bottom: var(--space-3);
  font-family: var(--family-record);
  font-size: var(--group-size);
  font-weight: var(--group-weight);
  letter-spacing: var(--group-tracking);
  text-transform: uppercase;
  color: var(--text-secondary);
}

/* Says the category is a guess. Without it a pre-filled chip reads as
   the app claiming to know what is on the plate. */
.mealpick__hint {
  margin: var(--space-3) 0 0;
  font-family: var(--family-record);
  font-size: var(--size-100);
  color: var(--text-muted);
}


/* ---------- Recipes header actions ---------- */

.recipes__actions { display: flex; gap: var(--space-2); flex-shrink: 0; }

.recipes__action {
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--target-min);
  height: var(--target-min);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-pill);
  background: var(--surface-raised);
  color: var(--text-action);
  cursor: pointer;
  transition: background var(--motion-enter), border-color var(--motion-enter);
}

.recipes__action[aria-pressed='true'] {
  background: var(--surface-tint);
  border-color: var(--surface-tint);
}

.recipes__action:focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-offset); }


/* Which servings the figures above describe. */
.nutri__for {
  display: block;
  margin-top: var(--space-1);
  font-family: var(--family-record);
  color: var(--text-muted);
}


/* ---------- Barcode scanner ---------- */
/* Shares the camera's chrome — same dark ground, same close button in
   the same corner — because they are two readings of the same gesture:
   point the phone at the thing. What differs is the target, so only the
   reticle differs. */

.camera__view--scan {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-invert);
}

.scan__window {
  position: relative;
  width: 70%;
  aspect-ratio: 3 / 2;
  border: 2px solid var(--paper-100);
  border-radius: var(--radius-md);
  opacity: 0.7;
}

.scan__line {
  position: absolute;
  left: var(--space-4);
  right: var(--space-4);
  top: 50%;
  height: 2px;
  background: var(--paper-100);
}

.scan__code { color: var(--text-invert); display: flex; }


/* ---------- Help ---------- */

.help__voice {
  margin: 0;
  font-family: var(--voice-family);
  font-style: var(--voice-style);
  font-size: var(--voice-size);
  line-height: var(--voice-leading);
  color: var(--text-primary);
}

.help__contact {
  margin: var(--space-3) 0 0;
  font-family: var(--family-record);
  font-size: var(--size-200);
  line-height: var(--leading-body);
  color: var(--text-secondary);
}

.help__address { color: var(--text-action); }


/* ---------- Editorial lines ---------- */
/* The product's voice, used where a screen would otherwise be a blank
   with a button on it. Not encouragement — an observation. */

.empty__voice {
  margin: 0 0 var(--space-2);
  font-family: var(--voice-family);
  font-style: var(--voice-style);
  font-size: var(--size-400);
  line-height: var(--leading-tight);
  color: var(--text-primary);
}

.profile__voice {
  margin: var(--space-4) 0 0;
  font-family: var(--voice-family);
  font-size: var(--voice-size);
  line-height: var(--voice-leading);
  color: var(--text-muted);
}


/* ---------- Search: editorial composition ---------- */
/* The statement the drawing opens this screen with. It is the app
   speaking, so it takes the voice — and it is set large enough to be
   the first thing read, above the field rather than beneath it. */
.search__statement {
  margin: var(--space-5) 0 var(--space-5);
  font-family: var(--voice-family);
  font-style: var(--voice-style);
  font-size: 32px;
  line-height: 42px;
  color: var(--text-primary);
}

/* The brand's interlock shape, cropped by the screen's own edges: a
   square with a notch taken out of two facing sides, which is the same
   cut the recipe panel makes against the photograph. Decorative, so it
   is hidden from assistive technology and never intercepts a tap. */
.mark {
  position: absolute;
  z-index: 0;
  display: block;
  width: 143px;
  height: 143px;
  /* Signal blue falling to butter at just over a tenth strength: the
     brand's two ends of the palette meeting, as a wash. */
  background: linear-gradient(150deg, var(--action-rest) 0%, var(--surface-warm) 100%);
  opacity: 0.12;
  pointer-events: none;
  clip-path: path("M 0 0 L 22 0 L 73 47 L 109 0 L 143 0 L 143 143 L 117 143 L 73 107 L 50 143 L 0 143 Z");
}

/* Placed where the drawing places them: one cropped by the top-right
   corner, one by the bottom-left, both mostly outside the frame.
   Positioned from the top because `.screen` is the containing block and
   giving this screen its own `position` would take that away — which is
   what put the second mark in the middle of the results list. */
/* Two marks, both cropped by the frame: one by the top-right corner,
   one by the bottom-left, exactly where the drawing crops them. The
   second is a different form — a tall rounded shape with two bites
   taken out of its sides — carried as its own path rather than a
   rotation of the first. */
.mark--head { top: -70px; right: -33px; }

.mark--foot {
  top: 786px;
  left: -50px;
  width: 140px;
  height: 140px;
  opacity: 0.10;
  background: linear-gradient(90deg, var(--surface-warm) 0%, var(--action-rest) 100%);
  clip-path: path("M0 15.679C0 7.01974 7.0197 0 15.679 0C19.6669 0 23.505 1.51959 26.4121 4.2495L41.7585 18.6608C57.4855 33.4294 82.5257 31.3905 95.6563 14.2722L99.8897 8.75305C104.122 3.23507 110.681 0 117.635 0C129.987 0 140 10.013 140 22.3647V121.314C140 131.634 131.634 140 121.314 140C117.045 140 112.905 138.538 109.582 135.858L92.9743 122.461C81.3069 113.049 64.0542 115.832 55.938 128.435C51.2959 135.644 43.3093 140 34.7354 140H31.3767C14.0478 140 0 125.952 0 108.623V15.679Z");
}

/* Everything real sits above the marks. */
.screen--search .screen__head,
.screen--search .screen__body { position: relative; z-index: 1; }


/* ---------- Saved: the compact list ---------- */
/* The drawing gives a saved row an 88 x 72 photograph — larger than a
   quick idea's square, because this is a list you came to on purpose,
   but nothing like the bordered card the screen used to stack. */
.quick--wide .quick__photo {
  width: 88px;
  aspect-ratio: 88 / 72;
  border-radius: var(--radius-md);
}

/* A lens over what is already kept. The word sits on the row with the
   chips so the row reads as one control rather than a stray label. */
.saved__filter {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-5);
}

.saved__filter-label {
  flex-shrink: 0;
  font-family: var(--family-record);
  font-size: var(--size-200);
  color: var(--text-secondary);
}

/* The chips take the rest of the row and scroll inside it; bleeding
   them would drag their negative margin over the word beside them. */
.saved__filter .chips { flex: 1; min-width: 0; }


/* ---------- Entry manifesto ---------- */
/* The one screen in the product where colour is atmosphere rather than
   role. Butter and signal blue, blurred past recognition, on ink — the
   same three colours the record uses, doing the only decorative job
   they are ever given. */

.manifesto {
  position: absolute;
  inset: 0;
  overflow: clip;
  background: var(--surface-invert);
  color: var(--text-invert);
}

.manifesto__glow {
  position: absolute;
  border-radius: var(--radius-pill);
  opacity: 0.7;
  pointer-events: none;
}

/* The top blob sits under a line of type, so it is the quietest. */
.manifesto__glow--butter-top { opacity: 0.4; }

.manifesto__glow--butter-top    { top: -45px; left: 265px; width: 180px; height: 180px; background: var(--surface-warm); filter: blur(19px); }
.manifesto__glow--blue-left     { top: 600px; left: -58px; width: 150px; height: 260px; background: var(--action-rest); filter: blur(23px); }
.manifesto__glow--tint          { top: 650px; left: 214px; width: 200px; height: 88px;  background: var(--surface-tint); filter: blur(15px); }
.manifesto__glow--blue-right    { top: 592px; left: 278px; width: 150px; height: 150px; background: var(--action-rest); filter: blur(14px); }
.manifesto__glow--butter-bottom { top: 770px; left: 250px; width: 210px; height: 150px; background: var(--surface-warm); filter: blur(21px); }

/* Everything readable sits above the glows, on the page's own gutter. */
.manifesto__sheet {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  /* border-box, or `height: 100%` adds its 80px of padding on top of
     the screen's own height and the support note falls past the clip. */
  box-sizing: border-box;
  height: 100%;
  padding: var(--space-7) var(--page-gutter) var(--space-6);
  overflow-y: auto;
}

.manifesto__meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-4);
}

.manifesto__stamp {
  font-family: var(--family-record);
  font-size: 9px;
  font-weight: var(--weight-regular);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--text-invert-muted);
}

.manifesto__stamp--strong { font-weight: var(--weight-medium); color: var(--text-invert-soft); }

/* A hairline in paper, the editorial rule the drawing opens with. */
.manifesto__rule {
  display: block;
  height: 1px;
  margin-top: var(--space-2);
  background: var(--text-invert);
  opacity: 0.35;
}

.manifesto__rule--short { width: 40px; margin-top: var(--space-5); }

.manifesto__headline {
  margin: var(--space-6) 0 0;
  font-family: var(--voice-family);
  font-style: var(--voice-style);
  font-weight: var(--weight-regular);
  font-size: 43px;
  line-height: 45px;
  color: var(--text-invert);
}

.manifesto__copy {
  max-width: 270px;
  margin: var(--space-6) 0 0;
  font-family: var(--family-record);
  font-size: var(--size-200);
  line-height: 20px;
  color: var(--text-invert-soft);
}

.manifesto__copy + .manifesto__copy { margin-top: var(--space-5); }

.manifesto__caps {
  margin: var(--space-5) 0 0;
  font-family: var(--family-record);
  font-size: var(--size-100);
  line-height: 20px;
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--text-invert-muted);
}

/* The action sits after the argument, not over it. */
.manifesto__foot { margin-top: auto; padding-top: var(--space-6); }

.manifesto__cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
}

.manifesto__support {
  margin: var(--space-5) 0 0;
  font-family: var(--family-record);
  font-size: 11px;
  line-height: 15px;
  color: var(--text-invert-muted);
}




/* ---------- Profile: the editorial statements ---------- */
.profile__statement {
  margin: var(--stack-group) 0 0;
  font-family: var(--voice-family);
  font-style: var(--voice-style);
  font-size: var(--size-300);
  line-height: var(--leading-voice);
  color: var(--text-primary);
}

.profile__closing {
  margin: var(--space-3) 0 0;
  font-family: var(--family-record);
  font-size: var(--size-200);
  color: var(--text-muted);
}


/* ---------- Motion ---------- */
/* Four roles, named at the token layer, applied here and nowhere else
   ad hoc. The hierarchy is deliberate:

     manifesto  expressive   the one place motion carries feeling
     recipes    editorial    photography settling into a page
     today      calm         a row arriving, a figure changing, no more

   Every rule below animates one or two properties. Nothing animates a
   layout property, so none of it can reflow the page while it runs. */


/* ---- A. Manifesto: one continuous move, not two fades ----

   The old version faded the words out and then faded Today in, which is
   two events with a seam between them. This is one: the words dissolve
   in sequence, the shapes keep drifting through the whole gesture, and
   the ground itself turns from ink to paper while they are still
   moving — so by the time the record mounts, the screen is already the
   colour the record lives on and only its content has to arrive. */

/* The ground clears to nothing rather than to paper. This is the whole
   difference between a crossing and a cut: the record is already
   mounted underneath, so fading the ink away reveals it — where fading
   to an opaque paper would hide it and then swap. */
.manifesto {
  z-index: 2;
  transition: background-color 460ms var(--ease-editorial) 120ms;
}

.manifesto--leaving {
  background-color: transparent;
  pointer-events: none;
}

/* The type dissolves in reading order, a beat apart. Opacity and a very
   short rise — no blur, no scale. */
.manifesto__meta,
.manifesto__rule,
.manifesto__headline,
.manifesto__copy,
.manifesto__caps,
.manifesto__foot {
  transition:
    opacity var(--duration-base) var(--ease-editorial),
    transform var(--duration-base) var(--ease-editorial);
}

.manifesto--leaving .manifesto__meta,
.manifesto--leaving .manifesto__rule,
.manifesto--leaving .manifesto__headline,
.manifesto--leaving .manifesto__copy,
.manifesto--leaving .manifesto__caps,
.manifesto--leaving .manifesto__foot {
  opacity: 0;
  transform: translateY(-6px);
}

.manifesto--leaving .manifesto__headline { transition-delay: 40ms; }
.manifesto--leaving .manifesto__copy     { transition-delay: 90ms; }
.manifesto--leaving .manifesto__caps     { transition-delay: 130ms; }
.manifesto--leaving .manifesto__rule     { transition-delay: 130ms; }
.manifesto--leaving .manifesto__foot     { transition-delay: 170ms; }

/* The shapes are the thing that carries over: they are still travelling
   when the record appears, which is what makes the two screens read as
   one space rather than two. Butter lifts toward where the masthead
   will be; blue sinks away. */
/* The shapes outlast the words and the ground both. They are still
   travelling over the record for about half a second after it appears,
   which is what makes the two screens read as one space. Opacity lets
   go last and slowest. */
.manifesto__glow {
  transition:
    transform 760ms var(--ease-editorial),
    opacity 420ms var(--ease-editorial) 340ms;
}

.manifesto--leaving .manifesto__glow { opacity: 0; }
.manifesto--leaving .manifesto__glow--butter-top    { transform: translateY(-56px) scale(1.4); opacity: 0.5; }
.manifesto--leaving .manifesto__glow--butter-bottom { transform: translateY(28px) scale(1.25); }
.manifesto--leaving .manifesto__glow--blue-left     { transform: translateY(64px); }
.manifesto--leaving .manifesto__glow--blue-right    { transform: translateY(64px); }
.manifesto--leaving .manifesto__glow--tint          { transform: translateY(48px); }

/* Continue answers the finger: a spring, scale only, faster than the
   gesture that triggered it. */
.manifesto__cta { transition: transform var(--motion-micro); }
.manifesto__cta:active { transform: scale(0.97); }

/* Today emerges into a screen that is already paper — it does not fade
   up from nothing, only its content rises the last few pixels. */
/* The record does not fade up as one slab — the ground is already
   paper by the time it mounts, so only its parts have to arrive. They
   come in reading order, close enough together to read as one movement
   rather than six: structure, greeting, the field, the suggestion, the
   record itself, then the bar.

   Six selectors, one keyframe, one property pair. Nothing here is
   animated individually beyond its delay. */
@keyframes enter-rise {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.app--entered .today__head,
.app--entered .input-bar,
.app--entered .suggestion,
.app--entered .today__group,
.app--entered .today__foot,
.app--entered .tabbar {
  animation: enter-rise var(--motion-emphasized) both;
}

/* Offset so the record begins arriving while the ink is clearing, not
   before it — otherwise the stagger plays behind an opaque ground and
   the reader sees a screen that has already finished assembling. */
.app--entered .today__head  { animation-delay: 200ms; }
.app--entered .input-bar    { animation-delay: 250ms; }
.app--entered .suggestion   { animation-delay: 300ms; }
.app--entered .today__group { animation-delay: 350ms; }
.app--entered .today__foot  { animation-delay: 350ms; }
.app--entered .tabbar       { animation-delay: 400ms; }

/* Groups after the first do not each get their own beat — the record is
   one block arriving, not a list dealing itself out. */
.app--entered .today__group ~ .today__group { animation-delay: 350ms; }


/* ---- B. Sheets: container, then what is in it ----
   The panel travels on a spring because a finger sent it there. Its
   contents do not travel with it as one slab — head, body and the
   action follow a beat apart, which is what makes the sheet read as
   holding things rather than being a picture of them. */
@keyframes sheet-part {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

.sheet[data-open='true'] .sheet__head,
.sheet[data-open='true'] .sheet__body,
.sheet[data-open='true'] .sheet__foot {
  animation: sheet-part var(--motion-emphasis) both;
}

.sheet[data-open='true'] .sheet__head { animation-delay: 60ms; }
.sheet[data-open='true'] .sheet__body { animation-delay: 110ms; }
.sheet[data-open='true'] .sheet__foot { animation-delay: 160ms; }


/* ---- C. Recipe detail: the photograph settles ----
   Arriving from a card, the hero starts fractionally larger and settles
   to its crop while the paper panel rises under it. Two elements, one
   property each — enough to read as the card's picture becoming the
   page's picture rather than one screen replacing another. */
@keyframes hero-settle {
  from { transform: scale(1.06); }
  to   { transform: none; }
}

@keyframes panel-rise {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: none; }
}

.screen--recipe .recipe__photo { animation: hero-settle var(--motion-editorial) both; }
.screen--recipe .recipe { animation: panel-rise var(--motion-emphasis) both; animation-delay: 80ms; }


/* ---- D. Today: calm to the point of near-invisibility ----
   A row that was just written introduces itself once, and the two
   figures cross-fade between values. Nothing else on this screen moves.
   The figures never count up: a total that climbs in front of you is a
   total you are being asked to beat, and this one states what
   happened. */
@keyframes row-enter {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

.swipe--new { animation: row-enter var(--motion-emphasis); }

.today__total-figure,
.section-header__sub { animation: figure-swap var(--motion-standard); }


/* ---- E. The action disc ----
   A plus turned an eighth of a turn is a cross, so opening the sheet
   turns the glyph that is already there. Press is a spring; the turn is
   standard, because it is a state change rather than a touch. */
.tabbar__add {
  transition:
    background var(--motion-standard),
    transform var(--motion-micro);
}

.tabbar__add svg { transition: transform var(--motion-standard); }
.tabbar__add:active { transform: scale(0.94); }
.tabbar__add--open svg { transform: rotate(45deg); }


/* ---- Reduced motion ----
   Durations are already zero by this point, so nothing has a chance to
   travel. These rules go further and remove the displacement itself, so
   that an element cannot jump to a translated end state — the screens
   simply change, which is the honest fallback. */
@media (prefers-reduced-motion: reduce) {
  /* No crossing: the ink clears at once and the record is simply there. */
  .manifesto { transition-duration: 0ms; transition-delay: 0ms; }
  .manifesto__glow { transition-duration: 0ms; transition-delay: 0ms; }

  .manifesto,
  .manifesto--leaving .manifesto__glow,
  .manifesto--leaving .manifesto__meta,
  .manifesto--leaving .manifesto__rule,
  .manifesto--leaving .manifesto__headline,
  .manifesto--leaving .manifesto__copy,
  .manifesto--leaving .manifesto__caps,
  .manifesto--leaving .manifesto__foot {
    transform: none;
  }

  .manifesto__cta:active,
  .portion__step:active:not(:disabled),
  .tabbar__add:active { transform: none; }

  .app--entered .today__head,
  .app--entered .input-bar,
  .app--entered .suggestion,
  .app--entered .today__group,
  .app--entered .today__foot,
  .app--entered .tabbar,
  .portion__step:active:not(:disabled),
  .swipe--new,
  .screen--recipe .recipe__photo,
  .screen--recipe .recipe,
  .sheet[data-open='true'] .sheet__head,
  .sheet[data-open='true'] .sheet__body,
  .sheet[data-open='true'] .sheet__foot {
    animation: none;
  }
}


/* The rule the drawing sets under a results heading. */
.section-header--separator {
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--border-hairline);
}


/* ---------- Search: the drawing's own rhythm ---------- */
/* Header is a column on a single 20 gap in Figma — back row, statement,
   field — which puts them at 48, 112 and 216. Built from each element's
   own margin instead, they landed 4 and 8 out. */
.screen--search .screen__head {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-bottom: var(--space-5);
}

.screen--search .screen__nav { margin-bottom: 0; }
.screen--search .search__statement { margin: 0; }

/* The results heading takes its distance from the body's top the way
   the drawing sets it, and the body no longer adds its own. */
.screen--search .screen__body { padding-top: 0; }
.screen--search .section-header { padding-top: calc(var(--stack-group) - var(--space-3)); }


/* ---------- preview chrome ---------- */

.pv-specimen { padding: var(--space-7) 0; border-bottom: 1px solid var(--border-hairline); }
.pv-specimen:last-child { border-bottom: 0; }
.pv-specimen__head { margin-bottom: var(--space-5); }
.pv-specimen__title { margin: 0; font-size: var(--size-400); font-weight: var(--weight-medium); }
.pv-specimen__note { margin: var(--space-1) 0 0; max-width: 62ch; font-size: var(--size-200); color: var(--text-muted); line-height: var(--leading-body); }

.pv-stage { display: flex; flex-wrap: wrap; gap: var(--space-6); align-items: flex-start; }

.pv-column {
  flex-shrink: 0;
  width: 390px;

  border-radius: var(--radius-md);
  background: var(--surface-page);

  flex-direction: column;
  gap: var(--space-4);

.pv-column > .row + .row { margin-top: calc(var(--space-4) * -1); }

.pv-frame {
  position: relative;
  flex-shrink: 0;

  border: 1px solid var(--border-strong);

}

.pv-frame__inner { position: relative; height: 100%; }

.pv-echo {

/* ============================================================
   recommend.js
   ============================================================ */
const { recommend } = (() => {
/**
 * recommend.js — which recipe to offer, and the reason for offering it.
 *
 * One rule, used by both Today and the Recipes tab, so the two never
 * disagree about what today has looked like. It is derived from the
 * record and nothing else: no time of day, no history, no goal, because
 * none of those are things the user has told this app.
 *
 * Every branch returns a reason, and a reason is a past-tense statement
 * of something already written down. There is deliberately no branch
 * that produces encouragement, and no field a "you should" could go in.
 * A recommendation with nothing true to say returns null and the card
 * does not appear.
 */


const KCAL = { protein: 4, carbs: 4, fat: 9 };

/* A day's worth of food, roughly, for a person this app knows nothing
   about. Used only to decide whether "light so far" is a fair thing to
   say — never shown, never compared against, never a target. */
const ORDINARY_DAY = 2000;

function recommend(entries) {
  if (!entries?.length) return null;

  const kcal = entries.reduce((t, e) => t + e.kcal, 0);
  const macros = entries.reduce(
    (t, e) => ({
      protein: t.protein + (e.macros?.protein ?? 0),
      carbs: t.carbs + (e.macros?.carbs ?? 0),
      fat: t.fat + (e.macros?.fat ?? 0),
    }),
    { protein: 0, carbs: 0, fat: 0 },
  );

  const energy = macros.protein * KCAL.protein + macros.carbs * KCAL.carbs + macros.fat * KCAL.fat;
  const proteinShare = energy ? (macros.protein * KCAL.protein) / energy : 0;

  let label;
  let question;
  let reason;
  let guidance;

  if (kcal < ORDINARY_DAY * 0.45) {
    label = 'More filling';
    question = 'Feeling like something more filling?';
    reason = 'Today has been light so far';
    guidance = 'A little more filling could balance today.';
  } else if (proteinShare < 0.2) {
    label = 'Higher in protein';
    question = 'Something with more protein in it?';
    reason = 'Today has been mostly carbohydrate so far';
    guidance = 'Something with more protein could round today out.';
  } else if (kcal > ORDINARY_DAY * 0.8) {
    label = 'Light option';
    question = 'Something lighter to finish on?';
    reason = 'Most of an ordinary day is already written down';
    guidance = 'Something lighter would sit well with the rest of today.';
  } else {
    return null;
  }

  const pick = RECIPES.find((r) => r.label === label);
  if (!pick) return null;

  /* `guidance` is the same judgement said as one sentence, for the
     Recipes tab; `question` + `reason` is the two-part form Today uses.
     Same rule, same day, two registers — never two conclusions. */
  return { recipe: pick, label, question, reason, guidance };
}

return { recommend };
})();

const SEARCH = 'M9 15A6 6 0 1 0 9 3a6 6 0 0 0 0 12ZM17 17l-3.8-3.8';
const CLEAR = 'M6 6l8 8M14 6l-8 8';

function SearchField({
  value,
  onChange,
  onFocus,
  loading = false,
  placeholder = 'Search food or dish',
}) {
  const filled = value.length > 0;

  return (
    <div className="search">
      <span className="search__glyph"><Glyph d={SEARCH} /></span>

      <input
        className="search__input"
        type="search"
        value={value}
        placeholder={placeholder}
        onChange={(e) => onChange(e.target.value)}
        onFocus={onFocus}
        autoComplete="off"
      />

      {loading && <span className="search__status">searching</span>}

      {filled && (
        <button className="search__action" type="button" onClick={() => onChange('')} aria-label="Clear search">
          <Glyph d={CLEAR} />
        </button>
      )}
    </div>
  );
}

return { SearchField };
})();

/**
 * Row — the list primitive.
 *
 * One component, three variants. Entry rows on Today, result rows in
 * Search, ingredient rows on Recipe detail are structurally identical:
 * name left, figure right, subtext under, hairline below. Building them
 * once is what keeps density consistent across both flows.
 *

 * composition tag became tappable: a button cannot contain a button,

 *
 * The tag is not blue. Blue means touchable in this system, but the

 *
 * meta and note share one subtext line. They are different kinds of

 */


function Row({
  variant = 'entry',   // 'entry' | 'result' | 'ingredient'
  name,
  meta,                // portion, brand or source
  note,                // a short description of the food itself
  noteDetail,          // what the note is derived from, revealed on tap
  figure,
  unit = '',
  onSelect,
}) {
  const [open, setOpen] = useState(false);

  const interactive = variant !== 'ingredient';
  const Main = interactive ? 'button' : 'div';
  const disclosable = !!(note && noteDetail);

  return (
    <div className={`row row--${variant}`}>
      <Main
        className="row__main"
        type={interactive ? 'button' : undefined}
        onClick={interactive ? onSelect : undefined}
      >
        <span className="row__name">{name}</span>

        {figure != null && (
          <span className="row__figure">
            {figure}{unit && <span className="figure__unit">{unit}</span>}
          </span>
        )}
      </Main>

      {(meta || note) && variant !== 'ingredient' && (
        <div className="row__meta">
          {meta}
          {meta && note && <span className="row__meta-sep" aria-hidden="true">·</span>}

          {note && (disclosable ? (
            <button
              className="row__note row__note--more"
              type="button"
              aria-expanded={open}
              onClick={() => setOpen(!open)}
            >
              {note}
            </button>
          ) : (
            <span className="row__note">{note}</span>
          ))}
        </div>
      )}

      {disclosable && open && <div className="row__detail">{noteDetail}</div>}
    </div>
  );

return { Row };
})();

/* ============================================================
   SectionHeader.jsx
   ============================================================ */
const { SectionHeader } = (() => {
/**
 * SectionHeader — grouping for lists.
 *
 * Three slots, and which one a number goes in decides how loudly it
 * reads:
 *
 *   label — the group's name.
 *   sub   — a figure about the group, set beside the label in the same
 *           quiet type. Group subtotals live here.
 *   note  — a right-aligned label for the column beneath it ("kcal"),
 *           or a small action belonging to the group.
 *
 * Three registers. `label` is the group header the record uses —
 * uppercase, tracked, signal blue, small enough to be structure rather
 * than content. `display` and `minor` are for a browsing screen, where
 * the section name is the content: sentence case, ink, and large enough
 * to be the thing you read first. A list of things to cook is not a
 * list of things you ate, and the two should not be titled the same way.
 *
 * The label is set as a group header — uppercase and tracked — while
 * the subtotal beside it stays in normal case. Numbers do not take
 * uppercase, and "385 KCAL" would read as shouting a figure on a
 * screen whose whole argument is that figures are not the point.
 *
 * Subtotals were originally in `note`, which put them flush right in
 * the same column as the item figures. Two numbers in one column read
 * as one series regardless of their size, so the group total kept
 * competing with the items it was summarising. Moving it to the left,
 * attached to the group it belongs to, leaves the right column to the
 * items alone — which is the only lever left, since the muted ink is
 * already the lightest text the palette allows.
 */

function SectionHeader({ label, sub, note, variant = 'label', separator = false }) {
  return (
    <div
      className={[
        'section-header',
        variant === 'label' ? '' : `section-header--${variant}`,
        /* The drawing rules a hairline under the results heading — the
           same "Show separator" the Figma component carries. */
        separator ? 'section-header--separator' : '',
      ].filter(Boolean).join(' ')}
    >
      <span className="section-header__label">
        <span className="section-header__name">{label}</span>
        {sub && <span className="section-header__sub">{sub}</span>}
      </span>
      {note && <span className="section-header__note">{note}</span>}
    </div>
  );
}

return { SectionHeader };
})();

/* ============================================================
   Sheet.jsx
   ============================================================ */
const { Sheet } = (() => {
/**
 * Sheet — the editing surface.
 *
 * Editing happens over the list, not on a screen of its own: the user
 * is correcting one line of something they can still see. The scrim
 * dims the record without hiding it.
 *
 * Escape and a scrim tap both close. There is no explicit cancel
 * button — leaving without saving is the default, and a sheet that
 * asks "are you sure?" over a portion size is asking about nothing.
 */


function Sheet({ open, onClose, title, meta, footer, children }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);

  return (
    <>
      <div className="sheet__scrim" data-open={open} onClick={onClose} />

      <div
        className="sheet"
        data-open={open}
        role="dialog"
        aria-modal="true"
        aria-hidden={!open}
        /* Empty string rather than a boolean: React 18 forwards
           inert="" and drops inert={false}, which is exactly the two
           states this needs. */
        inert={open ? undefined : ''}
        aria-label={title}
      >
        <div className="sheet__grabber" />

        {(title || meta) && (
          <div className="sheet__head">
            {title && <h2 className="sheet__title">{title}</h2>}
            {meta && <div className="sheet__meta">{meta}</div>}
          </div>
        )}

        <div className="sheet__body">{children}</div>

        {footer && <div className="sheet__foot">{footer}</div>}
      </div>
    </>
  );
}

return { Sheet };
})();

/* ============================================================
   PortionControl.jsx
   ============================================================ */
const { PortionControl } = (() => {
/**
 * PortionControl — how much of it.
 *
 * Household units first, grams last but always present. People know
 * they ate a bowl; they do not know it was 240 g, and making them
 * convert is the step where logging gets abandoned — so the chips carry
 * the conversion. But a scale is not an estimate, and someone who has
 * weighed their food should not have to express 137 g as "about one
 * cup". The grams chip is the escape from the household units, not a
 * separate mode of the component: it sits in the same row, and picking
 * it swaps the stepper for a field you can type into.
 *
 * Switching to grams keeps the weight you already had rather than
 * resetting — you arrive at the field with the estimate you were about
 * to correct, which is usually a small edit rather than a fresh entry.
 * Switching back to a household unit resets to one of them, because
 * "1 bowl" is a claim about a bowl and not about the grams that were
 * on screen a moment ago.
 *
 * Each chip carries its own weight, stacked under the unit name.
 * Without it the chips are a guess you can only check after committing
 * to it — you pick "bowl", read the grams underneath, and go back. The
 * weight is the whole basis of the estimate, so it belongs on the thing
 * you choose, not in the result of having chosen.
 *
 * The figure cross-fades on change (see .portion__figure). It never
 * counts up: a rising number makes a total feel earned.
 */


const GRAMS = { label: 'grams', grams: 1, manual: true };

const round = (n) => Math.round(n);
const digits = (value) => value.replace(/\D/g, '').slice(0, 4);

function PortionControl({
  units = [],              // [{ label, grams }]
  kcalPer100,
  onChange,
  allowGrams = true,       // off where a typed weight makes no sense
  format,                  // (count, unit) => string, for the count line
  initial,                 // { count, unitLabel, grams, manual } — where to open
}) {
  /* Servings of a recipe have no gram entry: nobody weighs out 240 g of
     a stew, and offering the field implies the recipe knows a density
     it does not have. Off by default nowhere — every existing caller
     is a food, where weighing is exactly the point. */
  const options = allowGrams ? [...units, GRAMS] : [...units];

  /* Opening at one unit is right for a new entry and wrong for an
     existing one: the sheet is also how you change an entry's meal, and
     an amount that resets on open rewrites the record for anyone who
     came to change something else. */
  const start = initial?.manual
    ? options.find((o) => o.manual)
    : options.find((o) => o.label === initial?.unitLabel);

  const [unit, setUnit] = useState(start ?? options[0]);
  const [amount, setAmount] = useState(
    initial?.manual ? String(initial.grams ?? 100) : String(initial?.count ?? 1),
  );

  /* One field, two meanings: a count of household units, or a weight in
     grams. They never coexist, and keeping them in one place is what
     lets the stepper stay the same control in both. */
  const n = Number(amount) || 0;
  const manual = !!unit.manual;
  const step = manual ? 10 : 1;

  const grams = manual ? n : round(unit.grams * n);
  const kcal = round((kcalPer100 * grams) / 100);

  const choose = (next) => {
    setAmount(next.manual ? String(grams || Math.round(unit.grams)) : '1');
    setUnit(next);
  };

  useEffect(() => {
    onChange?.({ unit, count: n, grams, kcal });
  }, [unit, amount]); // eslint-disable-line react-hooks/exhaustive-deps

  return (
    <div className="portion">
      {options.length > 1 && (
        <div className="portion__units">
          {options.map((u) => (
            <button
              key={u.label}
              className="portion__unit"
              type="button"
              aria-pressed={u.label === unit.label}
              aria-label={u.manual ? 'Grams, typed' : `${u.label}, about ${u.grams} grams`}
              onClick={() => choose(u)}
            >
              <span className="portion__unit-label">{u.label}</span>
              <span className="portion__unit-grams" aria-hidden="true">
                {u.manual ? 'exact' : `~${u.grams} g`}
              </span>
            </button>
          ))}
        </div>
      )}

      <div className="portion__amount">
        <button
          className="portion__step"
          type="button"
          aria-label="Less"
          disabled={n <= step}
          onClick={() => setAmount(String(Math.max(step, n - step)))}
        >
          −
        </button>

        <span className="portion__count">
          {manual ? (
            <>
              <input
                className="portion__input"
                type="text"
                inputMode="numeric"
                value={amount}
                aria-label="Weight in grams"
                onChange={(e) => setAmount(digits(e.target.value))}
              />
              <span className="portion__count-unit">g</span>
            </>
          ) : (
            <span aria-live="polite">
              {format ? format(n, unit) : `${n} × ${unit.label}`}
            </span>
          )}
        </span>

        <button
          className="portion__step"
          type="button"
          aria-label="More"
          onClick={() => setAmount(String(n + step))}
        >
          +
        </button>
      </div>

      <div className="portion__result">
        {/* In grams mode the weight is the thing being typed, so
            repeating it here would be an echo rather than a result. */}
        <span className="portion__grams">{manual ? `${kcalPer100} kcal / 100 g` : `${grams} g`}</span>
        <span className="portion__figure" key={kcal}>{kcal}<span className="figure__unit">kcal</span></span>
      </div>
    </div>
  );
}

return { PortionControl };
})();

/* ============================================================
   composition.js
   ============================================================ */
const { describeComposition, breakdown } = (() => {
/**
 * describeComposition — one plain phrase for what an entry is mostly
 * made of, or null when there is nothing worth saying.
 *
 * Derived, never authored. A hand-written tag per food is a place for
 * an opinion to hide: whoever fills the field decides which foods are
 * worth remarking on, and that decision is invisible in the data. A
 * rule is arguable in public — you can read these thresholds and
 * disagree with them.
 *
 * The thresholds are deliberately not symmetric. Protein rarely
 * dominates a mixed dish by energy, so a third of it is already the
 * notable thing about that food. Carbohydrate dominates most ordinary
 * meals, so it takes more of it to be worth remarking on.
 *
 * The carbohydrate threshold was 0.75 and the floor was 120 kcal, which
 * described three rows out of seven and left the record looking
 * patchy — a tag on some things and not others reads as a judgment
 * about which foods deserve comment. At 0.60 and 50 kcal most of a
 * normal day carries a description, and the rows that stay bare are
 * bare for a reason you can state: they are too small to matter, or
 * genuinely mixed.
 *
 * Below MIN_KCAL nothing is described at all. A 45 kcal side is
 * mostly-anything and it does not matter which; tagging it spends a
 * line of the record on noise and makes the tags that do matter harder
 * to notice.
 *
 * The phrases describe, they do not rank. There is no threshold that
 * produces praise or warning, no phrase that is better to see than
 * another, and nothing here reaches the colour tokens — the tag is set
 * in the same quiet type as the portion beside it.
 */

const KCAL_PER_G = { protein: 4, carbs: 4, fat: 9 };

const MIN_KCAL = 50;

const RULES = [
  { macro: 'protein', share: 0.35, phrase: 'high protein' },
  { macro: 'fat',     share: 0.55, phrase: 'mostly fat' },
  { macro: 'carbs',   share: 0.60, phrase: 'mostly carbs' },
];

function describeComposition(entry) {
  const macros = entry?.macros;
  if (!macros || entry.kcal < MIN_KCAL) return null;

  const energy = {};
  let total = 0;
  for (const macro of Object.keys(KCAL_PER_G)) {
    energy[macro] = (macros[macro] ?? 0) * KCAL_PER_G[macro];
    total += energy[macro];
  }
  if (!total) return null;

  /* Shares come from the macros' own energy rather than entry.kcal:
     the two rarely agree exactly, and dividing by the larger of them
     would quietly move every threshold. */
  const rule = RULES.find((r) => energy[r.macro] / total >= r.share);
  return rule ? rule.phrase : null;
}


/* The numbers behind the phrase, for the disclosure under the tag.
   Shares are shares of energy, which is the thing the tag is derived
   from — grams alone would make fat look like the smallest part of
   almost everything.

   Fibre is listed with a weight and no share. It is already counted
   inside the carbohydrate figure, so giving it a percentage would make
   the four rows add up to more than the whole and invite the reader to
   do arithmetic that does not work. */
function breakdown(entry) {
  const macros = entry?.macros;
  if (!macros) return null;

  let total = 0;
  for (const macro of Object.keys(KCAL_PER_G)) {
    total += (macros[macro] ?? 0) * KCAL_PER_G[macro];
  }
  if (!total) return null;

  const rows = [
    { label: 'Protein', grams: macros.protein ?? 0, share: ((macros.protein ?? 0) * KCAL_PER_G.protein) / total },
    { label: 'Carbs',   grams: macros.carbs ?? 0,   share: ((macros.carbs ?? 0) * KCAL_PER_G.carbs) / total },
    { label: 'Fat',     grams: macros.fat ?? 0,     share: ((macros.fat ?? 0) * KCAL_PER_G.fat) / total },
  ];

  if (macros.fibre != null) rows.push({ label: 'Fibre', grams: macros.fibre, share: null });

  return rows;
}

return { describeComposition, breakdown };
})();

   CompositionDetail.jsx
   ============================================================ */
const { CompositionDetail } = (() => {
/**
 * CompositionDetail — the numbers behind a composition tag.
 *
 * Shown only on request. The tag is the whole story for most people
 * most of the time; this is for the moment someone wants to check it,
 * and it is set quietly enough that opening one does not turn the row
 * into a panel.
 *
 * Deliberately a list and not a bar. A bar here would be the day-level
 * graphic coming back one row at a time, and at this size it would be
 * decoration — four short lines of figures answer the question faster
 * than four coloured segments do.
 */


function CompositionDetail({ entry }) {
  const rows = breakdown(entry);
  if (!rows) return null;

  return (
    <dl className="detail">
      {rows.map((row) => (
        <div className="detail__row" key={row.label}>
          <dt className="detail__label">{row.label}</dt>
          <dd className="detail__value">
            <span className="detail__grams">{row.grams} g</span>
            {/* Always rendered, even for fibre, which has no share. An
                omitted cell lets the weight slide into the percentage
                column and the figures stop lining up. */}
            <span className="detail__share">
              {row.share == null ? '' : `${Math.round(row.share * 100)}%`}
            </span>
          </dd>
        </div>
      ))}
    </dl>
  );
}

return { CompositionDetail };
})();

/* ============================================================
   SwipeRow.jsx
   ============================================================ */
const { SwipeRow } = (() => {
/**
 * SwipeRow — swipe left on an entry to uncover Delete.
 *
 * The whole row travels as one piece. An earlier version gave up width
 * instead of moving, which let the name rewrap mid-gesture and pulled
 * the entry apart while it was being acted on; the name, the amount and
 * the tag now stay together and slide together, because they describe
 * one thing and the gesture is about that one thing.
 *
 * The gesture reveals, it does not act. A swipe that deletes on release
 * makes the most destructive thing on the screen the easiest one to do
 * by accident, and the record is the one thing here nobody should lose
 * to a stray thumb. Uncovering the button is the first half; pressing
 * it is the second.
 *
 * One threshold, and it is the obvious one: past halfway it settles
 * open, short of halfway it springs back. A gesture that resolves to
 * whichever state it was nearer never feels like it fought you.
 *
 * It is an alternative, never the only way. Swiping is invisible to a
 * keyboard and to a screen reader, so tapping the row still opens the
 * sheet where the same action lives in text.
 *
 * Two discs, not a slab. A filled rectangle reaching the screen edge
 * reads as one target with a seam in it, and the seam is the only thing
 * separating "change this" from "lose this"; circles that do not touch
 * cannot be pressed by accident on the way to each other.
 *
 * Neither is red. There is no red in this palette, on purpose, and
 * inventing one to say "danger" would frame removing a line you wrote
 * as an error rather than an ordinary edit.
 */



/* Far enough that a scroll cannot trigger it, short enough to feel like
   a flick rather than a drag. */
const AXIS_LOCK = 12;

function SwipeRow({ open, onOpenChange, onEdit, onRemove, isNew = false, children }) {
  const actionRef = useRef(null);
  const start = useRef(null);
  const dxRef = useRef(0);
  const [dx, setDx] = useState(0);
  const [dragging, setDragging] = useState(false);

  const reveal = () => actionRef.current?.offsetWidth ?? 0;

  const move = (value) => {
    dxRef.current = value;
    setDx(value);
  };

  const onPointerDown = (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    start.current = { x: e.clientX, y: e.clientY, axis: null };
  };

  const onPointerMove = (e) => {
    if (!start.current) return;
    const moveX = e.clientX - start.current.x;
    const moveY = e.clientY - start.current.y;

    /* Until the gesture commits to horizontal the page keeps the event,
       or a swipe steals every attempt to scroll past a list of them. */
    if (!start.current.axis) {
      if (Math.abs(moveX) < AXIS_LOCK && Math.abs(moveY) < AXIS_LOCK) return;
      start.current.axis = Math.abs(moveX) > Math.abs(moveY) ? 'x' : 'y';
      if (start.current.axis === 'x') {
        setDragging(true);
        try { e.currentTarget.setPointerCapture?.(e.pointerId); } catch { /* not fatal */ }
      }
    }
    if (start.current.axis !== 'x') return;

    const base = open ? -reveal() : 0;
    move(Math.max(-reveal(), Math.min(0, base + moveX)));
  };

  const onPointerUp = () => {
    /* Read from the ref, not from state: React batches updates, and a
       release that reads the state variable can decide the gesture on a
       position from before the last move. */
    if (start.current?.axis === 'x') onOpenChange?.(dxRef.current < -reveal() / 2);
    start.current = null;
    setDragging(false);
    move(0);
  };

  const offset = dragging ? dx : open ? -reveal() : 0;

  return (
    <div className={isNew ? 'swipe swipe--new' : 'swipe'} data-open={open || undefined}>
      <div className="swipe__actions" ref={actionRef} aria-hidden={!open}>
        <button
          className="swipe__disc swipe__disc--edit"
          type="button"
          tabIndex={open ? 0 : -1}
          aria-label="Edit entry"
          onClick={() => { onOpenChange?.(false); onEdit?.(); }}
        >
          <Glyph d={ICON.pencil} size={18} />
        </button>

        <button
          className="swipe__disc swipe__disc--delete"
          type="button"
          tabIndex={open ? 0 : -1}
          aria-label="Delete entry"
          onClick={() => { onOpenChange?.(false); onRemove?.(); }}
        >
          <Glyph d={ICON.trash} size={18} />
        </button>
      </div>

      <div
        className="swipe__surface"
        data-dragging={dragging || undefined}
        style={{ transform: `translateX(${offset}px)` }}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={onPointerUp}
      >
        {children}

        {/* While the action is showing, a tap on the row closes it rather
            than opening the sheet underneath. Without this the row has
            two meanings for one tap. */}
        {open && (
          <button
            className="swipe__shield"
            type="button"
            aria-label="Close actions"
            onClick={() => onOpenChange?.(false)}
          />
        )}
      </div>
    </div>
  );
}

return { SwipeRow };
})();

/* ============================================================
   benefits.js
   ============================================================ */
const { benefitsFor } = (() => {
/**
 * benefits.js — what a meal contains, in a fixed vocabulary.
 *
 * These describe composition. They are not scores, not grades, and not
 * claims about what the food will do to anyone. "Good source of fibre"
 * says there is fibre in it; it does not say the meal is good, and
 * there is deliberately no phrase in this vocabulary for the opposite —
 * nothing here can mark a food as poor, and no recipe is left with a
 * label that reads as a warning.
 *
 * The thresholds follow the pattern EU nutrition labelling already
 * uses: roughly 15% of a reference intake to be a "source of"
 * something, 30% to be "rich in" it. Borrowing an existing, published
 * basis matters — a threshold invented in-house is an opinion about
 * food wearing a number's clothes.
 *
 * Protein and fibre follow the same logic against energy and portion.
 * Omega-3 is stated as a source of EPA and DHA, which is what the fish
 * contains; it says nothing about hearts, brains or inflammation,
 * because this app is in no position to.
 */

const NRV = { iron: 14, vitC: 80 };   /* mg, EU reference intakes */

const RULES = [
  {
    key: 'omega3',
    phrase: 'Omega-3 source',
    /* EPA + DHA in grams. 0.5 g is a serving that meaningfully
       contributes to the 250 mg/day commonly cited for adults. */
    value: (r) => r.nutrients?.omega3 ?? 0,
    threshold: 0.5,
  },
  {
    key: 'protein',
    phrase: 'Higher in protein',
    /* Share of the meal's energy, not grams: 20% is the EU line for
       "high protein". A large meal should not qualify just for being
       large. */
    value: (r) => {
      const m = r.macros ?? {};
      const energy = (m.protein ?? 0) * 4 + (m.carbs ?? 0) * 4 + (m.fat ?? 0) * 9;
      return energy ? ((m.protein ?? 0) * 4) / energy : 0;
    },
    threshold: 0.2,
  },
  {
    key: 'fibre',
    phrase: 'Good source of fibre',
    value: (r) => r.macros?.fibre ?? 0,
    threshold: 6,
  },
  {
    key: 'vitC',
    phrase: 'Rich in vitamin C',
    value: (r) => r.nutrients?.vitC ?? 0,
    threshold: NRV.vitC * 0.3,
  },
  {
    key: 'iron',
    phrase: 'Source of iron',
    value: (r) => r.nutrients?.iron ?? 0,
    threshold: NRV.iron * 0.15,
  },
];

/* Ordered by how far past its threshold each one is, so the benefit a
   recipe leads with is the one that is actually most true of it rather
   than whichever rule happens to sit first in the list. Cards no longer
   carry one — they show the recipe's own label — so this is read only
   by the detail screen, where there is room for all of them. */
function benefitsFor(recipe) {
  return RULES
    .map((rule) => ({ phrase: rule.phrase, key: rule.key, ratio: rule.value(recipe) / rule.threshold }))
    .filter((b) => b.ratio >= 1)
    .sort((a, b) => b.ratio - a.ratio);
}

return { benefitsFor };
})();

/* ============================================================
   forYou.js
   ============================================================ */
const { forYou, reasonFor } = (() => {
/**
 * forYou.js — recipes built from things already in the record.
 *
 * "For you" here means one specific, checkable thing: this recipe uses
 * ingredients you have written down before. Not a taste model, not a
 * profile, not an inference about who you are — a word match against
 * your own entries, which is why the section can state its reason out
 * loud ("uses chicken and rice") without sounding like it knows more
 * than it does.
 *
 * That honesty is the point. Personalisation that cannot explain itself
 * in one clause is personalisation the user has no way to disagree
 * with.
 */

/* Words that appear in food names without identifying a food. */
const NOISE = new Set([
  'with', 'and', 'the', 'of', 'a', 'in', 'no', 'half', 'large', 'small', 'medium',
  'g', 'ml', 'tbsp', 'tsp', 'tin', 'pack', 'slice', 'slices', 'bunch', 'piece', 'pieces',
  'cooked', 'boiled', 'baked', 'grilled', 'roasted', 'fresh', 'dry', 'dried',
  'thigh', 'breast', 'fillet', 'fillets', 'bowl', 'plate', 'cup',
  'oil', 'olive', 'salt', 'pepper', 'sauce', 'water', 'stock', 'seasoning',
  /* Real foods, but minor ones wherever they appear in a recipe. "Uses
     milk" is true of a mash and useless as a reason to cook it — the
     match has to be something the dish is actually made of, or the
     section is just showing that it can find words. */
  'milk', 'honey', 'cream', 'soured', 'butter', 'paste', 'lemon', 'juice',
  'herb', 'herbs', 'spice', 'spices', 'seed', 'seeds', 'sugar',
]);

/* Crude, and crude on purpose: "tomatoes" and "tomato" are the same
   ingredient to a person reading the card, and a stemmer that knew
   better would not change a single result across a list this size. */
const stem = (word) => word.replace(/(es|s)$/, '');

const words = (text) =>
  text.toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/)
    .filter((w) => w.length > 2 && !NOISE.has(w))
    .map(stem);

function forYou(entries, recipes) {
  const logged = new Set(entries.flatMap((e) => words(e.name)));
  if (!logged.size) return [];

  return recipes
    .map((recipe) => {
      const hits = [...new Set(
        recipe.ingredients.flatMap((i) => words(i.name)).filter((w) => logged.has(w)),
      )];
      return { recipe, hits };
    })
    .filter((match) => match.hits.length > 0)
    .sort((a, b) => b.hits.length - a.hits.length);
}

/* "chicken and rice" — the clause the section shows under a card. */
/* Two at most. A list of five matched words is a machine showing its
   working, not a person's reason for cooking something. */
const reasonFor = (hits) => {
  const top = hits.slice(0, 2);
  return top.length === 1 ? top[0] : `${top[0]} and ${top[1]}`;
};

return { forYou, reasonFor };
})();

const { FilterChips } = (() => {

 * FilterChips — a lens over the list, not a gate on it.

 *
 * "All" is always present and always reachable in one tap, and the list

          type="button"
          aria-pressed={option === value}
          onClick={() => onChange(option)}

}

return { FilterChips };

/* ============================================================
   TabBar.jsx
   ============================================================ */
const { TabBar } = (() => {
/**
 * TabBar — the three places, and the one action.
 *
 * Today, Recipes and Profile are places you can be; adding food is not
 * a place, so it is not a tab. It is a raised disc sitting in the same
 * row because that is where a thumb already is, and because every one
 * of the three input methods behind it ends in the same record.
 *
 * There is no Search tab. Search is how you use Today, not somewhere
 * you go — it is already the widest control on that screen, and giving
 * it a second home would split one action across two places.
 */


const TABS = [
  { id: 'today', label: 'Today', icon: ICON.today },
  { id: 'recipes', label: 'Recipes', icon: ICON.recipes },
  { id: 'saved', label: 'Saved', icon: ICON.bookmark },
  { id: 'profile', label: 'Profile', icon: ICON.profile },
];

function TabBar({ tab, onTab, onAdd, addOpen = false }) {
  /* Two destinations, the action, then two more: the disc sits in
     the middle of the bar rather than at the head of it. */
  const [first, second, ...rest] = TABS;

  const button = (t) => (
    <button
      key={t.id}
      className="tab"
      type="button"
      aria-current={tab === t.id ? 'page' : undefined}
      onClick={() => onTab(t.id)}
    >
      <Glyph d={t.icon} />
      <span className="tab__label">{t.label}</span>
    </button>
  );

  return (
    <nav className="tabbar" aria-label="Main">
      {button(first)}
      {button(second)}

      {/* The disc cannot stretch to a fifth of the bar without becoming
          an oval, so it sits in a slot that can. */}
      <span className="tabbar__slot">
        {/* One glyph, turned: a plus rotated an eighth of a turn is a
            cross, so opening the sheet does not swap the icon for a
            different one, it turns the one that is already there. */}
        <button
          className={addOpen ? 'tabbar__add tabbar__add--open' : 'tabbar__add'}
          type="button"
          onClick={onAdd}
          aria-expanded={addOpen}
          aria-label={addOpen ? 'Close' : 'Add to today'}
        >
          <Glyph d={ICON.plus} size={24} />
        </button>
      </span>

      {rest.map(button)}
    </nav>
  );
}

return { TabBar };
})();

 *
 * Each secondary method says what it is for. "Scan barcode" is obvious

/* ============================================================
   CalendarSheet.jsx
   ============================================================ */
const { CalendarSheet } = (() => {
/**
 * CalendarSheet — pick a day to look back at.
 *
 * A way to reach a past record, and nothing else. The grid carries no
 * dots, no totals and no marks for days with entries: a column of dots
 * across a month is a streak whatever it is called, and this app does
 * not tell anyone how consistent they have been. Days you did not write
 * anything down look exactly like days you did, because that is not
 * information this screen is willing to rank.
 *
 * Future days are disabled rather than hidden — the month is a real
 * month, and a calendar that ends on today reads as a countdown.
 */




const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const sameDay = (a, b) => startOfDay(a).getTime() === startOfDay(b).getTime();

function CalendarSheet({ open, onClose, selected, today, locale, onSelect }) {
  const [month, setMonth] = useState(new Date(selected.getFullYear(), selected.getMonth(), 1));

  const first = new Date(month.getFullYear(), month.getMonth(), 1);
  const days = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();

  /* Monday-first, which is what the rest of the copy assumes. */
  const lead = (first.getDay() + 6) % 7;

  const weekdays = Array.from({ length: 7 }, (_, i) =>
    new Date(2024, 0, 1 + i).toLocaleDateString(locale, { weekday: 'narrow' }));

  const canGoForward = month.getFullYear() < today.getFullYear()
    || (month.getFullYear() === today.getFullYear() && month.getMonth() < today.getMonth());

  return (
    <Sheet open={open} onClose={onClose} title="Look back">
      <div className="cal__head">
        <button
          className="cal__step"
          type="button"
          aria-label="Previous month"
          onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() - 1, 1))}
        >
          <Glyph d={ICON.back} />
        </button>

        <span className="cal__month">
          {month.toLocaleDateString(locale, { month: 'long', year: 'numeric' })}
        </span>

        <button
          className="cal__step"
          type="button"
          aria-label="Next month"
          disabled={!canGoForward}
          onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() + 1, 1))}
        >
          <span className="cal__forward"><Glyph d={ICON.back} /></span>
        </button>
      </div>

      <div className="cal__grid" role="grid">
        {weekdays.map((w, i) => (
          <span className="cal__weekday" key={i}>{w}</span>
        ))}

        {Array.from({ length: lead }, (_, i) => <span key={`lead-${i}`} />)}

        {Array.from({ length: days }, (_, i) => {
          const date = new Date(month.getFullYear(), month.getMonth(), i + 1);
          const future = startOfDay(date) > startOfDay(today);
          return (
            <button
              key={i}
              className="cal__day"
              type="button"
              disabled={future}
              aria-current={sameDay(date, today) ? 'date' : undefined}
              aria-pressed={sameDay(date, selected)}
              onClick={() => { onSelect(date); onClose(); }}
            >
              {i + 1}
            </button>
          );
        })}
      </div>
    </Sheet>
  );
}

return { CalendarSheet };
})();

/* ============================================================
   CompositionBar.jsx
   ============================================================ */
const { CompositionBar } = (() => {
/**
 * CompositionBar — what the day was made of.
 *
 * Length is composition, never progress: there is no track, no maximum
 * and no fill percentage, so the bar cannot be full or short of full.
 * It answers "what was this made of", which is an observation, where a
 * progress bar answers "how much of your allowance is left", which is a
 * score. The tokens (--bar-a/b/c, --bar-height, --bar-cap) exist for
 * exactly this and admit only three neutral colours — no green, no red.
 *
 * Segments carry their own legend. A bar whose colours have to be
 * decoded from memory is decoration; a bar with its figures printed
 * underneath is a second reading of the same fact.
 */

function CompositionBar({ segments }) {
  const total = segments.reduce((sum, s) => sum + s.value, 0);
  if (!total) return null;

  return (
    <div className="bar-group">
      <div className="bar" role="img" aria-label={segments.map((s) => `${s.label} ${s.value} ${s.unit}`).join(', ')}>
        {segments.map((s) => (
          <span
            key={s.label}
            className="bar__segment"
            style={{ flex: s.value, background: `var(${s.token})` }}
          />
        ))}
      </div>

      <div className="bar__legend" aria-hidden="true">
        {segments.map((s) => (
          <span className="bar__key" key={s.label}>
            <span className="bar__swatch" style={{ background: `var(${s.token})` }} />
            {s.label}
            <span className="bar__value">{s.value} {s.unit}</span>
          </span>
        ))}
      </div>
    </div>
  );
}

return { CompositionBar };
})();

/* ============================================================
   PortionSheet.jsx
   ============================================================ */
const { PortionSheet } = (() => {
/**
 * PortionSheet — how much, which meal, and what happens next.
 *
 * One sheet for both jobs. Adding a food and editing one already in the
 * record ask the same two questions, so they use the same control; what
 * differs is what the buttons promise, and that is the whole of the
 * difference:
 *
 *   add   → "Add to today", and no way to remove something that is not
 *           there yet.
 *   edit  → "Save changes", with "Remove from today" underneath.
 *
 * Before this existed the two flows had grown separate copies of the
 * same sheet, which is how one of them ended up offering to remove a
 * food that had never been added.
 *
 * The meal is asked in both. When adding it is a suggestion from the
 * clock and says so; when editing it is simply what the entry is, and
 * needs no explanation.
 */






function PortionSheet({
  mode = 'add',            // 'add' | 'edit'
  open,
  food,                    // { name, units, kcalPer100 }
  meal,
  onClose,
  onSubmit,
  onRemove,
}) {
  const [draft, setDraft] = useState(null);
  const [chosen, setChosen] = useState(meal);

  /* Only the meal is reset here. The amount resets by itself, because
     PortionControl is keyed on the food and remounts with it — and
     clearing the draft from this effect actively broke the flow: child
     effects run before parent ones, so this wiped the initial reading
     the control had just emitted and every add fell back to 100 g. */
  useEffect(() => { setChosen(meal); }, [meal, food?.name]);

  const adding = mode === 'add';

  /* An entry records how much was eaten only as a sentence — "2 pieces"
     — so there is nothing structured to reopen on unless a previous
     draft left one. Failing that, reconstruct the count from the figure
     the entry already carries: the unit's own weight says what one of
     them costs, and the entry's kcal says how many there were. */
  const initial = useMemo(() => {
    if (adding || !food) return undefined;
    if (food.amount) return food.amount;
    const first = food.units?.[0];
    const one = first && food.kcalPer100 ? (food.kcalPer100 * first.grams) / 100 : 0;
    if (!one || food.kcal == null) return undefined;
    return { count: Math.max(1, Math.round(food.kcal / one)), unitLabel: first.label };
  }, [adding, food]);

  return (
    <Sheet
      open={open}
      onClose={onClose}
      title={food?.name}
      meta={adding ? 'How much of it?' : 'How much was it?'}
      footer={
        <>
          <button
            className="button"
            type="button"
            onClick={() => onSubmit({ ...(draft ?? {}), meal: chosen })}
          >
            {adding ? 'Add to today' : 'Save changes'}
          </button>

          {!adding && onRemove && (
            <button className="today__minor" type="button" onClick={onRemove}>
              Remove from today
            </button>
          )}
        </>
      }
    >
      {food && (
        <>
          <PortionControl
            key={food.name}
            units={food.units}
            kcalPer100={food.kcalPer100}
            initial={initial}
            onChange={setDraft}
          />

          <div className="mealpick">
            <span className="mealpick__label">{adding ? 'Adding to' : 'Meal'}</span>
            <FilterChips label="Meal" options={MEALS} value={chosen} onChange={setChosen} bleed={false} />
            {adding && <p className="mealpick__hint">Suggested from the time of day.</p>}
          </div>
        </>
      )}
    </Sheet>
  );
}

return { PortionSheet };
})();

/* ============================================================
   CameraScreen.jsx
   ============================================================ */
const { CameraScreen } = (() => {
/**
 * CameraScreen — point it at the plate.
 *
 * "Analyse a photo" used to land straight on a result, with no step in
 * between. That is why it did not read as a photo flow: nothing was
 * ever photographed. This is the missing step — frame, shutter, then a
 * moment of the app visibly working before it says anything.
 *
 * No camera API. A prototype does not need permission to demonstrate
 * what the screen is for, and asking for one would put a system dialog
 * in the middle of a design review.
 *
 * The pause after the shutter is not decoration. An estimate that
 * appears instantly reads as a lookup; the second it takes to arrive is
 * what tells the user something was worked out from the picture, and
 * therefore that it could be wrong.
 */



const ANALYSING_MS = 1600;

function CameraScreen({ photo, onClose, onAnalysed }) {
  const [phase, setPhase] = useState('framing');

  useEffect(() => {
    if (phase !== 'analysing') return undefined;
    const t = setTimeout(onAnalysed, ANALYSING_MS);
    return () => clearTimeout(t);
  }, [phase, onAnalysed]);

  return (

  );

return { CameraScreen };
})();

const { BarcodeScreen } = (() => {
/**
 * BarcodeScreen — the scanner, and only the scanner.
 *
 * Barcode used to open the food search with a query typed into it,
 * which meant two of the three ways in were the same screen wearing
 * different labels. They are separate methods for separate situations —
 * a packet has a code, a plate does not — and collapsing one into
 * another taught the wrong thing about both.
 *

 * returns where you came from with nothing written down.

 * The read is simulated on a timer. What matters for review is the

const READ_MS = 1900;

function BarcodeScreen({ product, defaultMeal, onClose, onAdd }) {
  const [found, setFound] = useState(false);

  useEffect(() => {

  return (
    <div className="camera">
      <div className="camera__view camera__view--scan">
        <div className="scan__window" aria-hidden="true">

        <span className="camera__spacer" aria-hidden="true" />
