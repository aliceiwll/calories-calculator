const { PhotoReviewScreen } = (() => {
/**
 * PhotoReviewScreen — flow A, photo branch.
 *
 * The estimate arrives as a draft, not an answer. Everything on this
 * screen is editable, nothing is committed until the user says so, and
 * the total is a range rather than a false-precision single figure.
 *
 * Why a range: photo estimation genuinely cannot resolve a plate to
 * ±5 kcal, and printing "551 kcal" claims accuracy the method doesn't
 * have. Showing 480–620 is both more honest and — usefully — reads as
 * an observation rather than a score, which keeps the photo branch
 * consistent with the rest of the product.
 *
 * No per-item confidence badges. They add noise, and a low-confidence
 * marker on a food is one design revision away from looking like
 * disapproval of that food. Editability covers the same need.
 *
 * Needed no new components: Row (entry variant), Sheet, PortionControl,
 * SectionHeader and Button all carried over unchanged.
 *
 * There was an "Add something it missed" button here that was wired to
 * nothing. A control that does not do what it says is worse than the
 * gap it was covering, so it is gone rather than guessed at.
 */







const round10 = (n) => Math.round(n / 10) * 10;

function PhotoReviewScreen({ photo, detected, onAdd, onBack }) {
  const [items, setItems] = useState(detected);
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState(null);

  const mid = items.reduce((sum, i) => sum + i.kcal, 0);
  const low = round10(mid * 0.85);
  const high = round10(mid * 1.15);

  const replace = (id, kcal) =>
    setItems(items.map((i) => (i.id === id ? { ...i, kcal } : i)));

  return (
    <div className="screen screen--estimate">
      {/* A way out that writes nothing. The estimate screen used to have
          none: once you were here the only control that led anywhere was
          "Add to today". */}
      <div className="screen__head">
        <ScreenHead title="From the photo" onBack={onBack} />
      </div>

      <div className="screen__body">
        <div className="estimate__photo" style={photo ? { backgroundImage: `url(${photo})`, backgroundSize: 'cover' } : undefined} />

        <p style={{
          fontFamily: 'var(--voice-family)',
          fontSize: 'var(--voice-size)',
          lineHeight: 'var(--voice-leading)',
          color: 'var(--voice-color)',
          margin: '0 0 var(--space-2)',
        }}>
          Estimated from the photo. Change anything that’s off.
        </p>

        <SectionHeader label="On the plate" note="kcal" />

        <div className="list">
          {items.map((item) => (
            <Row
              key={item.id}
              variant="entry"
              name={item.name}
              meta={item.portion}
              figure={item.kcal}
              onSelect={() => setEditing(item)}
            />
          ))}
        </div>

        <div className="estimate__total">
          <span style={{ fontFamily: 'var(--family-record)', fontSize: 'var(--size-200)', color: 'var(--text-muted)' }}>
            Roughly
          </span>
          <span className="estimate__range">{low}–{high}<span className="figure__unit">kcal</span></span>
        </div>

        <button className="button" type="button" onClick={() => onAdd(items)}>
          Add to today
        </button>
      </div>

      <Sheet
        open={!!editing}
        onClose={() => setEditing(null)}
        title={editing?.name}
        meta="How much was it?"
        footer={
          <button
            className="button"
            type="button"
            onClick={() => {
              replace(editing.id, draft?.kcal ?? editing.kcal);
              setEditing(null);
            }}
          >
            Save
          </button>
        }
      >
        {editing && (
          <PortionControl
            units={editing.units}
            kcalPer100={editing.kcalPer100}
            onChange={setDraft}
          />
        )}
      </Sheet>
    </div>
  );
}

return { PhotoReviewScreen };
})();

/* ============================================================
   TodayScreen.jsx
   ============================================================ */
const { TodayScreen } = (() => {
/**
 * TodayScreen — Screen 1, the home of the product.
 *
 * The record is the screen. What you ate is the content; the number is
 * an attribute of it. That ordering decides every layout question here:
 * the list gets the space and the top of the screen, the day total gets
 * a single quiet line at the bottom.
 *
 * Four things, in this order:
 *   1. Search, pinned. The primary action stays reachable at any scroll
 *      position, because the most common intent on this screen is "add
 *      the thing I just ate", not "review what I already logged".
 *   2. The day's entries, dense, grouped by part of day.
 *   2a. One contextual recipe card, at the top of the record rather
 *      than after it — below the fold is the same as absent for the
 *      only thing on the screen that looks forward.
 *   3. The day total, as a fact.
 *
 * Why the total sits at the bottom and not the top: a figure placed
 * above the record is a headline, and a headline invites comparison to
 * something. Placed under the record it reads as a sum of the lines
 * above it — a receipt total. It is pinned rather than scrolled away
 * because it is genuinely useful, but it is set at --size-400, below
 * the display sizes, so it never becomes the thing you open the app to
 * look at.
 *
 * Deliberately absent: goal, remaining, streak, percentage, ring, any
 * over/under colouring. No token exists for any of them — see the notes
 * in tokens.css.
 *
 * Composition is described per item rather than summed for the day.
 * A day-level bar answers "what was today made of", which is a question
 * about a number; a tag under a row answers "what is this", which is a
 * question about a food, and the food is what the screen is for. It
 * also survives the honest case where only some entries carry macros —
 * a bar with half the day missing is wrong, a row with no tag is just
 * a row. CompositionBar is parked, not deleted, in case a day-level
 * summary earns its place back.
 *
 * Voice on this screen: the record and its total are stated in the past
 * tense as facts ("So far today", "Nothing written down yet today");
 * the only forward-looking line is the suggestion, and it is phrased as
 * an option with its reason attached. Nothing here tells the user what
 * to do, notes what they have not done, or congratulates them — there
 * is no "you haven't logged lunch", no streak, no "great job". The
 * absence of an entry is shown by the absence of a row.
 *
 * Grouping is by part of day (Morning / Midday / Evening / Later)
 * rather than by meal name. "Breakfast" empty at 3pm reads as a missed
 * obligation; "Morning" with nothing under it is simply not shown.
 *
 * Row gained a `note` slot for the composition tag; the phrasing rule
 * lives in composition.js. Entries are wrapped in SwipeRow, which is a
 * second route to the two actions the sheet already offers — never the
 * only route to either.
 */











/* The order and the words come from data.js, so the record and the
   recipes cannot disagree about what a meal is called. They were
   Morning / Midday / Evening / Later, which described the clock rather
   than the meal. An empty category is still not shown, so "Breakfast"
   never sits blank at three in the afternoon. */

const sum = (list, pick) => list.reduce((total, item) => total + (pick(item) ?? 0), 0);
const fmt = (n, locale) => Math.round(n).toLocaleString(locale);

/* Locale is a prop rather than the machine's: the date and the
   thousands separator are part of the copy, and a screen that mixes an
   English record with a locally formatted date reads as half-finished.
   Defaults to the user's own when nothing is passed. */
const dayLabel = (date, locale) =>
  date.toLocaleDateString(locale, { weekday: 'long', day: 'numeric', month: 'long' });

function TodayScreen({
  date = new Date(),
  isToday = true,
  locale,
  entries,
  suggestion,          // { title, question, reason, meta, onOpen, onDismiss }
  query = '',
  onQueryChange,
  onSearch,
  onPhoto,
  onBarcode,
  onOpenCalendar,
  onBackToToday,
  onChangeEntry,
  onRemoveEntry,
  lastAdded,
  onEmptyAction,
}) {
  const [editing, setEditing] = useState(null);


  /* Which row has its actions uncovered, held here rather than in each
     row, so that opening one closes the last. */
  const [swiped, setSwiped] = useState(null);

  /* Fixed order, empty parts omitted. A part of the day with nothing in
     it is not a gap to be filled. */
  const groups = useMemo(
    () =>
      MEALS.map((meal) => ({ meal, items: entries.filter((e) => e.meal === meal) }))
        .filter((g) => g.items.length > 0),
    [entries],
  );

  const total = sum(entries, (e) => e.kcal);

  return (
    <div className="screen screen--warm">
      <div className="screen__head">
        <div className="today__head">
          <h1 className="today__title">{isToday ? 'Hello, Alisa!' : dayLabel(date, locale)}</h1>

          {/* The date is the way into the calendar. It is already the
              thing on screen that says which day you are looking at, so
              making it the control means there is one date, not a date
              and a button that also means date. */}
          <button
            className="today__date"
            type="button"
            aria-label="Choose a day"
            onClick={onOpenCalendar}
          >
            <Glyph d={ICON.calendar} size={16} />
            {/* Only on today. A past day already spells itself out in
                the title beside this, and repeating it here pushed both
                onto two lines each. */}
            {isToday && dayLabel(date, locale)}
          </button>
        </div>

        {isToday ? (
          <InputBar
            value={query}
            onChange={onQueryChange}
            onFocus={onSearch}
            onPhoto={onPhoto}
            onBarcode={onBarcode}
          />
        ) : (
          /* A past day is a record, not a workspace. Nothing is added
             to a day that has already happened, so the entry points are
             replaced by the way back to the one that has not. */
          <button className="today__back" type="button" onClick={onBackToToday}>
            Back to today
          </button>
        )}
      </div>

      <div className="screen__body">
        {suggestion && isToday && entries.length > 0 && (
          <SuggestionCard
            title={suggestion.title}
            question={suggestion.question}
            reason={suggestion.reason}
            meta={suggestion.meta}
            photo={suggestion.photo}
            onOpen={suggestion.onOpen}
            onDismiss={suggestion.onDismiss}
          />
        )}

        {entries.length === 0 ? (
          <div className="empty">
            <p className="empty__text">
              {isToday ? 'Nothing written down yet today.' : 'Nothing was written down on this day.'}
            </p>
            {isToday && (
              <button className="button empty__cta" type="button" onClick={onEmptyAction}>
                Add the first thing
              </button>
            )}
          </div>
        ) : (
          groups.map(({ meal, items }) => (
            <div className="today__group" key={meal}>
              <SectionHeader
                key={sum(items, (i) => i.kcal)}
                label={meal}
                sub={`${fmt(sum(items, (i) => i.kcal), locale)} kcal`}
              />
              <div className="list">
                {items.map((item) => (
                <SwipeRow
                  key={item.id}
                  isNew={item.id === lastAdded}
                  open={swiped === item.id}
                  onOpenChange={(next) => setSwiped(next ? item.id : null)}
                  onEdit={() => setEditing(item)}
                  onRemove={() => onRemoveEntry?.(item.id)}
                >
                  <Row
                    variant="entry"
                    name={item.name}
                    meta={item.portion}
                    note={describeComposition(item)}
                    noteDetail={<CompositionDetail entry={item} />}
                    figure={fmt(item.kcal, locale)}
                    onSelect={() => setEditing(item)}
                  />
                  </SwipeRow>
                ))}
              </div>
            </div>
          ))
        )}

      </div>

      {entries.length > 0 && (
        <div className="screen__foot today__foot">
          <div className="today__total">
            <span className="today__total-label">{isToday ? 'So far today' : 'That day'}</span>
            {/* Keyed on the figure so a change remounts it and the
                cross-fade runs. It never counts up — see below. */}
            <span className="today__total-figure" key={total}>
              {fmt(total, locale)}<span className="figure__unit">kcal</span>
            </span>
          </div>
        </div>
      )}

      <PortionSheet
        mode="edit"
        open={!!editing}
        food={editing}
        meal={editing?.meal}
        onClose={() => setEditing(null)}
        onSubmit={(draft) => { onChangeEntry?.(editing.id, draft); setEditing(null); }}
        onRemove={() => { onRemoveEntry?.(editing.id); setEditing(null); }}
      />
    </div>
  );
}

return { TodayScreen };
})();

const { RecipesScreen } = (() => {
/**
 * RecipesScreen — one composed screen, not a stack of blocks.
 *
 * Read top to bottom it is: what this is, what kind of meal you are
 * after, one sentence about today, then the food. The two browsing
 * decisions come first and take almost no height; everything after
 * them is photography.
 *
 * Browsing is by meal category, because "what am I looking for" is the
 * question people arrive with. What a recipe is like — more filling,
 * lighter, higher in protein — is only useful once you are looking at
 * one, so it stays on the card and out of the filter row. Putting both
 * in the same row of chips was what made neither of them read clearly.
 *
 * Three sections, sized by how much they matter:
 *
 *   Based on today — a note, inset, one sentence and a thumbnail.
 *   For you        — the body of the screen. Large photographs, sideways,
 *                    each saying which of your own foods it is built from.
 *   Quick ideas    — a quieter list, but with pictures big enough to scan.
 *
 * All recipes closes it, so nothing is ever more than one screen away
 * from everything.
 *
 * Saved is a state of this screen rather than a fourth tab: it is the
 * bookmark already on every card, given somewhere to be read back.
 */












const ALL = 'All';
const QUICK_MINUTES = 20;

function RecipesScreen({
  suggestion,

              </div>

                    destination in the bar now, so keeping a second way
                    in would leave the same list behind two doors. */}

                  type="button"

                >
                  <Glyph d={ICON.search} />
                </button>

          </>

      <div className="screen__body">
        {narrowed ? (
          <>
            <SectionHeader

const { SavedScreen } = (() => {
/**
 * SavedScreen — the bookmarks, given somewhere to be read back.
 *
 * A compact list, not a wall of cards. A recipe you have already chosen
 * does not need to be sold to you again, so the row is the same shape
 * the Quick ideas list uses: a small photograph, the name, what it costs

 * this list removes the row from under your finger — the honest result
 * of the only action on it.

function SavedScreen({ saved, onToggleSave, onOpen, onBrowse }) {
  const [lens, setLens] = useState(ALL);

     order a list arrives in should not change under you. */
  const list = RECIPES.filter((r) => saved.has(r.id));
  const empty = list.length === 0;

  /* Only the labels actually present in what is kept. A filter offering
     a category with nothing behind it is a dead end. */
  const labels = [...new Set(list.map((r) => r.label).filter(Boolean))];
  const shown = lens === ALL ? list : list.filter((r) => r.label === lens);

  return (
    <div className="screen screen--warm">
      <div className="screen__head">
        <div className="recipes__head">
          <div className="recipes__heading">
            <h1 className="today__title">Saved</h1>
            <p className="recipes__lede">
              {empty ? 'Nothing here yet.' : 'Recipes you wanted to come back to.'}
            </p>
          </div>
        </div>
      </div>

      <div className="screen__body">

const { RecipeDetailScreen } = (() => {
/**
 * RecipeDetailScreen — something you can actually cook.
 *
 * The old screen listed ingredients and a macro table and called it a
 * recipe, which meant the one thing the user came for — how to make it
 * — was the one thing missing. Order now runs:
 *
 *   the food → the recipe → why it matters → what is in it →
 *   how to make it → add it
 *
 * Nutrition supports that order rather than leading it. The whole
 * summary is one line of four figures; the benefit labels say what the
 * meal contains, and the note explains where those come from. None of
 * it claims anything about what the food will do to anyone — this app
 * knows what is on the plate and nothing about the person eating it.
 *
 * The photograph is the screen's ground rather than a band across the
 * top of it. A band ends in a straight edge, which is the shape of a
 * thumbnail; a ground the content rides over is the shape of a page
 * about food. One asymmetric corner is where the two meet, and it is
 * the only place on the screen the interlock appears — repeated lower
 * down it stops being a transition and becomes wallpaper.
 *
 * Back and save sit together over the photograph, same size, same
 * treatment, one at each edge. The save used to sit on the title,
 * where it read as punctuation after the recipe's name; paired with
 * back it reads as what it is, one of the two things you can do to
 * this screen from outside its content.
 *
 * Servings are chosen here, next to the button, using the same
 * PortionControl the record uses for a portion of food — and changing
 * them changes the recipe, not just the label. Ingredient quantities and
 * the nutrition line both scale, because a serving control that moves
 * only the number it is attached to is a control that lies about what
 * it does. Instructions is the one tab without the stepper: a step is
 * not a quantity. The control is hidden there rather than unmounted,
 * so the count you chose on Overview is still the count you come back
 * to — one serving state for the whole screen.
 */

/* Weights round to the nearest 5, counts to the nearest half. Halving a
   recipe should not produce "1.5 eggs to 1 decimal place". */
const scaleQty = (qty, unit, factor) => {
  const value = qty * factor;
  if (unit === 'g' || unit === 'ml') return String(Math.max(5, Math.round(value / 5) * 5));
  const half = Math.round(value * 2) / 2;
  return Number.isInteger(half) ? String(half) : half.toFixed(1);
};

const ingredientLine = (item, factor) =>
  item.qty == null
    ? item.name
    : `${item.name}, ${scaleQty(item.qty, item.unit, factor)}${item.unit ? ` ${item.unit}` : ''}`;

const TABS = ['Overview', 'Ingredients', 'Instructions'];









function RecipeDetailScreen({ recipe, saved, onToggleSave, onBack, onLog }) {
  const [portion, setPortion] = useState(null);
  const [tab, setTab] = useState('Overview');

     everything scales from there rather than from one serving. */
  const factor = servings / recipe.servings;
  const totals = {
    kcal: Math.round(recipe.kcal * servings),
    protein: Math.round(recipe.macros.protein * servings),
    carbs: Math.round(recipe.macros.carbs * servings),
    fat: Math.round(recipe.macros.fat * servings),
  };
  const plural = servings === 1 ? '' : 's';

  /* Per-serving grams are only needed so the stepper has something to
     multiply; the recipe's own figures are already per serving. */
  const perServing = [{ label: 'serving', grams: 100 }];

  return (
    <div className="screen screen--recipe">
      <RecipePhoto src={recipe.photo} alt={recipe.title} className="recipe__photo" />

      <div className="recipe__actions">
        <button className="recipe__action" type="button" aria-label="Back" onClick={onBack}>

      <div className="screen__body screen__body--flush">

          <div className="recipe__facts">
            <span className="recipe__fact">
              <Glyph d={ICON.clock} size={16} />

            </span>

          </div>

          <div className="rtabs" role="tablist" aria-label="Recipe">
            {TABS.map((name) => (
              <button
                key={name}

            <div className="list">

                <Row
                  key={food.id}

                  meta={food.brand}

                  onSelect={() => setChosen(food)}
                />
              ))}
            </div>
          </>
        )}
      </div>

      <PortionSheet
        mode="add"
        open={!!chosen}
        food={chosen}
        meal={defaultMeal}
        onClose={() => setChosen(null)}
        onSubmit={(draft) => {
          onAdd({
            name: chosen.name,
            portion: portionLabel(draft),
            kcal: draft.kcal ?? Math.round(chosen.kcalPer100),
            kcalPer100: chosen.kcalPer100,
            units: chosen.units,
            meal: draft.meal,
            amount: draft.unit
              ? { count: draft.count, unitLabel: draft.unit.label, grams: draft.grams, manual: !!draft.unit.manual }
              : undefined,
            macros: scaleMacros(chosen.macros, draft.grams ?? 100),
          });
          setChosen(null);
        }}
      />
    </div>
  );
}

const portionLabel = (draft) =>
  !draft.unit ? '1 portion'
    : draft.unit.manual ? `${draft.grams} g`
    : `${draft.count} × ${draft.unit.label}`;

/* Food tables are per 100 g; the record stores what was actually eaten. */
const scaleMacros = (macros, grams) => {
  if (!macros) return undefined;
  const factor = grams / 100;
  return Object.fromEntries(
    Object.entries(macros).map(([key, value]) => [key, Math.round(value * factor)]),
  );
};

return { SearchScreen };
})();

/* ============================================================
   App.jsx
   ============================================================ */
const { App } = (() => {
/**
 * App — the shell, and the only place navigation lives.
 *
 * Three tabs and one stack. A pushed screen (search, a recipe, the
 * photo branch) covers the tab bar rather than sitting inside it,
 * because each of them is a task with an end: you finish it and you are
 * returned, and a tab bar underneath would offer a way to abandon it
 * halfway that leaves nothing written down.
 *
 * Everything that adds food ends in the same place — one entry, on one
 * day, in the record. Search, barcode, photo and a recipe are four
 * doors into that, not four kinds of thing.
 *
 * State is deliberately flat and in memory. This is a prototype; there
 * is no persistence, and pretending otherwise would mean building the
 * part of the product that is not being reviewed.
 */


















const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const daysBetween = (a, b) => Math.round((startOfDay(a) - startOfDay(b)) / 86400000);

let seq = 0;
const nextId = () => `n${++seq}`;

/* What the portion control was showing, kept on the entry so that
   reopening it later starts where the entry actually is rather than at
   one unit. Without this an edit sheet opened to change the meal would
   quietly rewrite the amount. */
const amountOf = (draft) => (draft?.unit
  ? { count: draft.count, unitLabel: draft.unit.label, grams: draft.grams, manual: !!draft.unit.manual }
  : undefined);

function App({ today = new Date(), locale = 'en-GB' }) {
  const [tab, setTab] = useState('today');

  /* The manifesto is the way in, and it does not cut to the record — the
     two overlap. 'crossing' renders both: the record mounts and begins
     arriving underneath while the manifesto is still resolving on top
     of it, so the shapes carry across a screen that is already there
     rather than across nothing. Only at 'done' is the manifesto taken
     out of the tree.

     Declared with the other state so the hook order never changes. */
  const [entry, setEntry] = useState('manifesto');
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const beginEntry = () => {
    if (entry !== 'manifesto') return;
    setEntry('crossing');
    timers.current.push(setTimeout(() => setEntry('done'), 940));
  };

  /* One pushed screen at a time: { name, id }. A prototype does not
     need a stack deeper than the flows it is demonstrating. */
  const [pushed, setPushed] = useState(null);
  const [sheet, setSheet] = useState(null);

  const [viewing, setViewing] = useState(startOfDay(today));
  const [days, setDays] = useState(DAYS);
  const [query, setQuery] = useState('');
  const [dismissed, setDismissed] = useState(false);

  /* The entry written most recently, so the record can introduce it
     rather than have it appear already in place. */
  const [lastAdded, setLastAdded] = useState(null);

  /* Saved recipes, and the Recipes tab's own dismissal, both live here
     because a card and a detail screen have to agree about them. There
     is no Saved list to browse — the state is the bookmark itself. */
  const [saved, setSaved] = useState(() => new Set());
  const [contextDismissed, setContextDismissed] = useState(false);

  const toggleSave = (id) => setSaved((prev) => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });

  const offset = daysBetween(today, viewing);
  const isToday = offset === 0;
  const entries = days[offset] ?? [];

  const suggestion = useMemo(() => recommend(days[0] ?? []), [days]);

  const addEntry = (partial) => {
    const item = {
      id: nextId(),
      meal: partial.meal ?? mealForHour(today.getHours()),
      ...partial,
    };
    setDays((d) => ({ ...d, 0: [...(d[0] ?? []), item] }));
    setLastAdded(item.id);
    setViewing(startOfDay(today));
    setPushed(null);
    setSheet(null);
    setTab('today');
    setQuery('');
  };

  const logRecipe = (recipe, servings = 1) => addEntry({
    name: recipe.title,
    portion: `${servings} serving${servings === 1 ? '' : 's'}`,
    kcal: recipe.kcal * servings,
    /* Not rounded: a serving is a nominal 400 g, and rounding the
       density here put the figure back a few kcal every time the entry
       was reopened. */
    kcalPer100: (recipe.kcal / 400) * 100,
    units: [{ label: 'serving', grams: 400 }, { label: 'half', grams: 200 }],
    amount: { count: servings, unitLabel: 'serving', grams: servings * 400, manual: false },
    macros: Object.fromEntries(
      Object.entries(recipe.macros).map(([k, v]) => [k, v * servings]),
    ),
  });

  const changeEntry = (id, draft) =>
    setDays((d) => ({
      ...d,
      [offset]: (d[offset] ?? []).map((e) =>
        e.id === id ? {
          ...e,
          /* A draft may carry only the meal — the portion sheet lets
             someone change the category without touching the amount. */
          kcal: draft.kcal ?? e.kcal,
          meal: draft.meal ?? e.meal,
          amount: amountOf(draft) ?? e.amount,
          portion: draft.unit
            ? (draft.unit.manual ? `${draft.grams} g` : `${draft.count} × ${draft.unit.label}`)
            : e.portion,
        } : e),
    }));

  const removeEntry = (id) =>
    setDays((d) => ({ ...d, [offset]: (d[offset] ?? []).filter((e) => e.id !== id) }));

  if (entry === 'manifesto') {
    return <ManifestoScreen key="manifesto" onContinue={beginEntry} />;
  }

  if (pushed?.name === 'search') {
    return (
      <SearchScreen
        initialQuery={pushed.query ?? ''}
        defaultMeal={mealForHour(today.getHours())}
        onBack={() => setPushed(null)}
        onAdd={addEntry}
      />
    );
  }

  if (pushed?.name === 'recipe') {
    return (
      <RecipeDetailScreen
        recipe={recipeById(pushed.id)}
        saved={saved.has(pushed.id)}
        onToggleSave={toggleSave}
        onBack={() => setPushed(null)}
        onLog={logRecipe}
      />
    );
  }

  if (pushed?.name === 'barcode') {
    return (
      <BarcodeScreen
        product={SCANNED}
        defaultMeal={mealForHour(today.getHours())}
        onClose={() => setPushed(null)}
        onAdd={(product, draft) => addEntry({
          name: product.name,
          portion: draft.unit?.manual ? `${draft.grams} g` : `${draft.count} × ${draft.unit.label}`,
          kcal: draft.kcal,
          kcalPer100: product.kcalPer100,
          units: product.units,
          meal: draft.meal,
          amount: amountOf(draft),
          macros: product.macros,
        })}
      />
    );
  }

  if (pushed?.name === 'help') {
    return <HelpScreen onBack={() => setPushed(null)} />;
  }

/* ?audit=1 looks for the class of bug that produced the Row overlap:
   text drawn on top of other text, or spilling past the box that is
   meant to contain it. Sibling rectangles are compared directly,
   because that is what "the name runs through the figure" actually is
   — two boxes occupying the same pixels. Results land in #audit so
   they can be read with --dump-dom instead of by eye. */
function audit() {
  const out = [];

  /* Inside an svg, overlapping is the drawing. And className there is
     an SVGAnimatedString, which stringifies to [object …] and made
     every finding unreadable. */
  const drawn = (el) => !!el.ownerSVGElement || el.tagName.toLowerCase() === 'svg';
  const name = (el) => (typeof el.className === 'string' && el.className) || el.tagName.toLowerCase();
  const placed = (el) => {
    const p = getComputedStyle(el).position;
    return p === 'absolute' || p === 'fixed';
  };
  const hits = (a, b) =>
    a.right > b.left + 0.5 && b.right > a.left + 0.5 &&
    a.bottom > b.top + 0.5 && b.bottom > a.top + 0.5;

  /* Content box, not border box. Padding is empty by definition, so a
     neighbour pulled into it is not text on top of text — which is the
     only thing this is looking for. Comparing border boxes reported
     every row whose subtext is pulled up into the button's target
     padding. */
  const content = (el) => {
    const r = el.getBoundingClientRect();
    const cs = getComputedStyle(el);
    const px = (v) => parseFloat(cs[v]) || 0;
    return {
      left: r.left + px('paddingLeft') + px('borderLeftWidth'),
      right: r.right - px('paddingRight') - px('borderRightWidth'),
      top: r.top + px('paddingTop') + px('borderTopWidth'),
      bottom: r.bottom - px('paddingBottom') - px('borderBottomWidth'),
    };
  };

  document.querySelectorAll('.pv-frame *, .pv-column *').forEach((parent) => {
    if (drawn(parent)) return;
    const kids = [...parent.children].filter((k) => !placed(k) && !drawn(k) && k.getClientRects().length);
    for (let i = 0; i < kids.length; i++) {
      for (let j = i + 1; j < kids.length; j++) {
        const a = content(kids[i]);
        const b = content(kids[j]);
        if (hits(a, b)) {
          out.push(`COLLIDE <${name(kids[i])}> x <${name(kids[j])}> "${(kids[i].textContent || '').slice(0, 30)}" / "${(kids[j].textContent || '').slice(0, 30)}"`);
        }
      }
    }

    /* Text wider than the box holding it, where nothing clips it, is
       drawn over whatever sits next to it. A flex item's box does not
       grow when its text overflows — it is pinned by flex-basis — so
       comparing rectangles alone never sees this; scrollWidth does. */
    kids.forEach((k) => {
      const kcs = getComputedStyle(k);
      if (kcs.overflow !== 'visible' || kcs.position === 'absolute') return;
      /* A box holding a deliberate full-bleed child measures wider than
         itself by design. That is the bleed, not an overflow. */
      if (k.querySelector(':scope > .bleed')) return;
      if (k.clientWidth > 0 && k.scrollWidth > k.clientWidth + 1) {
        out.push(`OVERFLOW <${name(k)}> ${k.scrollWidth}px of text in ${k.clientWidth}px "${(k.textContent || '').trim().slice(0, 30)}"`);
      }
    });

    /* Spilling past a parent that does not clip means the text is drawn
       over whatever sits next to it. A parent that clips is fine — that
       is truncation working. */
    const cs = getComputedStyle(parent);
    if (cs.overflow !== 'visible' || placed(parent)) return;
    /* .bleed leaves its container deliberately, to run a scroller to the
       edges of the screen through the parent's padding. It is the one
       case where crossing the boundary is the design. */
    const bleeds = (el) => el.classList.contains('bleed');
    /* Border box, not content box. A control pulled into its parent's
       own padding by a negative margin is deliberate and still inside
       the parent; only crossing the outer edge is a spill. */
    const right = parent.getBoundingClientRect().right;
    kids.forEach((k) => {
      if (bleeds(k)) return;
      const r = k.getBoundingClientRect();
      if (r.right > right + 0.5) {
        out.push(`SPILL <${name(k)}> past <${name(parent)}> by ${(r.right - right).toFixed(1)}px "${(k.textContent || '').slice(0, 30)}"`);
      }
    });
  });

  /* Ink is a decision, black is the absence of one. Any text drawn in
     pure black got there by inheriting from nothing. */
  document.querySelectorAll('.pv-frame *, .pv-column *').forEach((el) => {
    const hasText = [...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim());
    if (!hasText || drawn(el)) return;
    const c = getComputedStyle(el).color;
    if (c === 'rgb(0, 0, 0)') {
      out.push(`BLACK <${name(el)}> "${(el.textContent || '').trim().slice(0, 30)}"`);
    }
  });

  const box = document.createElement('pre');
  box.id = 'audit';
  box.textContent = out.length ? [...new Set(out)].join('\n') : 'AUDIT CLEAN';
  document.body.appendChild(box);
}

/* ?click=<selector> presses everything matching, once the page has
   rendered, so a state that only exists after an interaction — an open
   disclosure, a selected chip — can be screenshotted as the real thing
   rather than mocked up with a prop that only the preview would use. */
const clickTarget = new URLSearchParams(window.location.search).get('click');
if (clickTarget) {
  /* Steps separated by >> are pressed in order, with a beat between
     them, so a whole flow can be walked and screenshotted at the end of
     it rather than mocked up state by state. */
  setTimeout(async () => {
    for (const raw of clickTarget.split('>>')) {
      const step = raw.trim();
      if (step.startsWith('swipe:')) {
        /* A real drag, mid-chain, so a flow that begins with a gesture
           can be walked like any other. */
        const el = document.querySelector(step.slice(6));
        if (el) {
          const box = el.getBoundingClientRect();
          const y = box.top + box.height / 2;
          const send = (type, x) => el.dispatchEvent(new PointerEvent(type, {
            bubbles: true, clientX: x, clientY: y, pointerId: 1, pointerType: 'touch', button: 0,
          }));
          const tick = () => new Promise((r) => setTimeout(r, 40));
          send('pointerdown', box.right - 20); await tick();
          send('pointermove', box.right - 60); await tick();
          send('pointermove', box.right - 160); await tick();
          send('pointerup', box.right - 160); await tick();
        }
      } else if (step.startsWith('type:')) {
        /* Typed through the native setter so React sees a real input
           event — assigning .value alone leaves the component's state
           untouched and the screen unchanged. */
        const [, selector, text] = step.match(/^type:([^:]+):(.*)$/);
        const el = document.querySelector(selector);
        if (el) {
          const set = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
          set.call(el, text);
          el.dispatchEvent(new Event('input', { bubbles: true }));
        }
      } else {
        const el = document.querySelector(step);
        if (el) { el.focus?.(); el.click(); }
      }
      await new Promise((r) => setTimeout(r, 260));
    }
  }, 400);
}

/* ?swipe=<selector> drags each match to the left with real pointer
   events, so the uncovered actions can be screenshotted as the state
   the gesture actually produces rather than one a preview-only prop
   forced open. */
const swipeTarget = new URLSearchParams(window.location.search).get('swipe');
if (swipeTarget) {
  setTimeout(async () => {
    /* The first match only. The list keeps one row open at a time, so
       swiping every match would just leave the last one showing. */
    const el = document.querySelector(swipeTarget);
    if (el) {
      const box = el.getBoundingClientRect();
      const y = box.top + box.height / 2;
      const send = (type, x) => el.dispatchEvent(new PointerEvent(type, {
        bubbles: true, clientX: x, clientY: y, pointerId: 1, pointerType: 'touch', button: 0,
      }));
      /* A tick between events, because a real gesture arrives in
         separate tasks and a burst dispatched in one would exercise
         batching behaviour no finger can produce. */
      const tick = () => new Promise((r) => setTimeout(r, 30));
      send('pointerdown', box.right - 20); await tick();
      send('pointermove', box.right - 60); await tick();
      send('pointermove', box.right - 180); await tick();
      send('pointerup', box.right - 180); await tick();
    }
  }, 400);
}

if (new URLSearchParams(window.location.search).get('audit')) {
  setTimeout(audit, 600);
}

})();
</script>
</body>
</html>
